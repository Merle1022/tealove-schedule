<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鮮茶樂 - 原物料庫存管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col relative bg-transparent">

    <!-- 背景圖更名為 background.png -->
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('background.png'); background-size: cover; background-position: center; opacity: 0.5; z-index: -1; pointer-events: none;"></div>

    <header class="bg-amber-600/90 backdrop-blur-md text-white shadow-md py-4 px-6 sticky top-0 z-30">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="index.html" class="hover:bg-amber-700 p-2 rounded-lg transition" title="回首頁">
                    <i class="fa-solid fa-house"></i>
                </a>
                <h1 class="text-xl font-bold tracking-wide"><i class="fa-solid fa-boxes-stacked mr-2"></i>原物料庫存管理</h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportToCSV()" class="bg-amber-700 hover:bg-amber-800 text-white text-xs px-3 py-2 rounded-lg transition font-medium flex items-center gap-1 shadow-sm border border-amber-500">
                    <i class="fa-solid fa-file-csv"></i> 匯出 CSV
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto p-4 lg:p-6 mt-4">
        <div class="glass-panel rounded-2xl p-6 md:p-8">
            <div class="flex justify-between items-end mb-6 border-b border-slate-200 pb-4">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">目前庫存盤點</h2>
                    <p class="text-sm text-slate-500 mt-1">數據直接與雲端 Google 試算表同步連動。</p>
                </div>
                <span id="lastSavedTime" class="text-xs text-slate-400 font-medium">載入中...</span>
            </div>

            <div class="space-y-4" id="inventoryContainer">
                <!-- 綠茶葉 -->
                <div class="flex items-center justify-between p-4 bg-white/60 rounded-xl border border-slate-200 hover:bg-white transition">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-600"><i class="fa-solid fa-leaf text-xl"></i></div>
                        <div><h3 class="font-bold text-lg text-slate-800">特級綠茶葉</h3><p class="text-xs text-slate-500">單位：包 (600g)</p></div>
                    </div>
                    <input type="number" id="qty-tea" min="0" placeholder="0" class="w-24 text-center text-lg font-bold text-slate-700 bg-white border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>

                <!-- 珍珠 -->
                <div class="flex items-center justify-between p-4 bg-white/60 rounded-xl border border-slate-200 hover:bg-white transition">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center text-amber-700"><i class="fa-solid fa-circle text-xl"></i></div>
                        <div><h3 class="font-bold text-lg text-slate-800">黑糖珍珠</h3><p class="text-xs text-slate-500">單位：箱 (20kg)</p></div>
                    </div>
                    <input type="number" id="qty-boba" min="0" placeholder="0" class="w-24 text-center text-lg font-bold text-slate-700 bg-white border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>

                <!-- 糖漿 -->
                <div class="flex items-center justify-between p-4 bg-white/60 rounded-xl border border-slate-200 hover:bg-white transition">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center text-orange-600"><i class="fa-solid fa-jug-detergent text-xl"></i></div>
                        <div><h3 class="font-bold text-lg text-slate-800">蔗糖糖漿</h3><p class="text-xs text-slate-500">單位：桶 (5L)</p></div>
                    </div>
                    <input type="number" id="qty-sugar" min="0" placeholder="0" class="w-24 text-center text-lg font-bold text-slate-700 bg-white border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>

                <!-- 特調配方 -->
                <div class="flex items-center justify-between p-4 bg-rose-50/60 rounded-xl border border-rose-200 hover:bg-rose-50 transition relative overflow-hidden">
                    <div class="absolute right-0 top-0 w-2 h-full bg-gradient-to-b from-green-400 to-green-600"></div>
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center text-green-600 drop-shadow-md"><i class="fa-solid fa-cannabis text-2xl"></i></div>
                        <div><h3 class="font-bold text-lg text-green-800">特調配方 (大麻)</h3><p class="text-xs text-rose-500 font-medium">VIP 隱藏菜單專用 / 單位：克 (g)</p></div>
                    </div>
                    <input type="number" id="qty-weed" min="0" placeholder="0" class="w-24 text-center text-lg font-bold text-green-700 bg-white border border-green-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
            </div>

            <div class="mt-8 flex justify-end gap-3 border-t border-slate-200 pt-6">
                <button onclick="loadInventoryFromCloud()" class="px-6 py-3 border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 rounded-xl transition font-bold shadow-sm">
                    <i class="fa-solid fa-rotate-left mr-1"></i> 重整讀取
                </button>
                <button onclick="saveInventoryToCloud()" id="saveBtn" class="px-8 py-3 bg-amber-600 hover:bg-amber-700 text-white rounded-xl transition font-bold shadow-md flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> 儲存雲端庫存
                </button>
            </div>
        </div>
    </main>

    <div id="toastMessage" class="fixed bottom-5 right-5 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 transform translate-y-12 opacity-0 transition-all duration-300 z-50 pointer-events-none">
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg" id="toastIcon"></i>
        <span class="text-sm font-medium" id="toastText">庫存已成功儲存！</span>
    </div>

    <script>
        var API_URL = "https://script.google.com/macros/s/AKfycbwnGQO2gI_2ixVXyWnvJp33dJNogm1GCY5yGQl-ZxQ-DaPwCByUdlbajAx9a6y6xsqCtg/exec";
        
        var role = localStorage.getItem('tealove_role');
        if (!role) { window.location.href = 'login.html'; } 
        else if (role !== 'admin') {
            alert('您沒有權限存取庫存管理頁面！');
            window.location.href = 'index.html';
        }

        var inventoryItems = ['qty-tea', 'qty-boba', 'qty-sugar', 'qty-weed'];

        window.onload = function() {
            loadInventoryFromCloud();
        };

        async function loadInventoryFromCloud() {
            document.getElementById('lastSavedTime').textContent = "正在讀取雲端庫存...";
            try {
                var response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getInventory' }),
                    redirect: 'follow'
                });
                var result = await response.json();
                if (result.success) {
                    inventoryItems.forEach(id => {
                        var el = document.getElementById(id);
                        if (el && result.inventory[id] !== undefined) {
                            el.value = result.inventory[id];
                        }
                    });
                    document.getElementById('lastSavedTime').textContent = result.lastSavedTime ? "最後同步：" + result.lastSavedTime : "尚無儲存紀錄";
                } else {
                    document.getElementById('lastSavedTime').textContent = "讀取失敗：" + result.message;
                }
            } catch(e) {
                document.getElementById('lastSavedTime').textContent = "無法連線至雲端資料庫";
            }
        }

        async function saveInventoryToCloud() {
            var saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = "正在同步至雲端...";
            
            var invData = {};
            inventoryItems.forEach(id => {
                var el = document.getElementById(id);
                invData[id] = el ? (parseFloat(el.value) || 0) : 0;
            });

            try {
                var response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'saveInventory', inventory: invData }),
                    redirect: 'follow'
                });
                var result = await response.json();
                if (result.success) {
                    showToast("🎉 庫存數據已成功同步至雲端試算表！");
                    loadInventoryFromCloud();
                } else {
                    showToast("❌ 儲存失敗: " + result.message, "error");
                }
            } catch(e) {
                showToast("❌ 無法連線至伺服器", "error");
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> 儲存雲端庫存';
            }
        }

        function showToast(msg, type = "success") {
            var toast = document.getElementById('toastMessage');
            var toastText = document.getElementById('toastText');
            var toastIcon = document.getElementById('toastIcon');
            toastText.textContent = msg;
            if (type === "success") toastIcon.className = "fa-solid fa-circle-check text-emerald-400 text-lg";
            else toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400 text-lg";
            
            toast.classList.remove('opacity-0', 'translate-y-12');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-12');
            }, 2500);
        }

        function exportToCSV() {
            var csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "原物料名稱,庫存數量\n";
            var itemNames = {'qty-tea': '特級綠茶葉', 'qty-boba': '黑糖珍珠', 'qty-sugar': '蔗糖糖漿', 'qty-weed': '特調配方 (大麻)'};
            inventoryItems.forEach(id => {
                var el = document.getElementById(id);
                var qty = el ? (el.value || 0) : 0;
                csvContent += `${itemNames[id]},${qty}\n`;
            });
            var link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", `鮮茶樂_雲端庫存盤點表.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
