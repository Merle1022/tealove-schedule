<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鮮茶樂 - 系統登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex items-center justify-center relative bg-transparent">

    <!-- 背景圖更名為 background.png -->
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('background.png'); background-size: cover; background-position: center; opacity: 0.5; z-index: -1; pointer-events: none;"></div>

    <div class="glass-card p-8 md:p-12 rounded-3xl max-w-sm w-full mx-4 shadow-2xl relative overflow-hidden">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner">
                <i class="fa-solid fa-user-lock text-3xl text-emerald-600"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-wide">鮮茶樂員工入口</h1>
            <p class="text-xs text-slate-500 mt-2">請輸入您的帳號密碼以登入系統</p>
        </div>

        <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">帳號</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="username" required placeholder="請輸入帳號" class="w-full pl-10 pr-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-600 transition text-sm bg-white/80">
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">密碼</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required placeholder="請輸入密碼" class="w-full pl-10 pr-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-600 transition text-sm bg-white/80">
                </div>
            </div>

            <div id="errorMsg" class="text-rose-500 text-xs font-medium text-center hidden">
                帳號或密碼錯誤，請重試。
            </div>

            <button type="submit" id="loginBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl transition duration-300 shadow-md">
                登入系統
            </button>
        </form>
    </div>

    <script>
        // 你的 GAS 部署網址
        var API_URL = "https://script.google.com/macros/s/AKfycbwnGQO2gI_2ixVXyWnvJp33dJNogm1GCY5yGQl-ZxQ-DaPwCByUdlbajAx9a6y6xsqCtg/exec";

        localStorage.removeItem('tealove_role');
        localStorage.removeItem('tealove_username');
        localStorage.removeItem('tealove_empId');

        async function handleLogin(event) {
            event.preventDefault();
            var user = document.getElementById('username').value.trim();
            var pass = document.getElementById('password').value;
            var errorMsg = document.getElementById('errorMsg');
            var loginBtn = document.getElementById('loginBtn');

            errorMsg.classList.add('hidden');
            loginBtn.disabled = true;
            loginBtn.textContent = "連線驗證中...";

            try {
                // 使用 text/plain 繞過 CORS，並設定 redirect: follow 跟隨 GAS 的重新導向
                var response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'login', username: user, password: pass }),
                    redirect: 'follow'
                });
                
                var textResult = await response.text();
                var result;
                try {
                    result = JSON.parse(textResult);
                } catch(e) {
                    console.error("伺服器回傳錯誤格式:", textResult);
                    throw new Error("伺服器設定異常，請確認 GAS 權限為『所有人』且發布為『新版本』。");
                }

                if (result.success) {
                    localStorage.setItem('tealove_role', result.role);
                    localStorage.setItem('tealove_username', result.name);
                    localStorage.setItem('tealove_empId', result.employeeId);
                    window.location.href = 'index.html';
                } else {
                    errorMsg.textContent = result.message || "帳號或密碼錯誤，請重試。";
                    errorMsg.classList.remove('hidden');
                }
            } catch (error) {
                console.error(error);
                errorMsg.textContent = error.message || "無法連線至伺服器，請檢查網路或 GAS 狀態。";
                errorMsg.classList.remove('hidden');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = "登入系統";
            }
        }
    </script>
</body>
</html>
