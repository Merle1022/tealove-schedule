    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

            background: rgba(255, 255, 255, 0.9);

<body class="text-slate-800 min-h-screen flex flex-col relative bg-transparent">

    <!-- 背景圖更名為 background.png -->
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('background.png'); background-size: cover; background-position: center; opacity: 0.5; z-index: -1; pointer-events: none;"></div>

    <header class="bg-amber-600/90 backdrop-blur-md text-white shadow-md py-4 px-6 sticky top-0 z-30">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="index.html" class="hover:bg-amber-700 p-2 rounded-lg transition" title="回首頁">
                    <i class="fa-solid fa-house"></i>
                </a>
                <h1 class="text-xl font-bold tracking-wide"><i class="fa-solid fa-boxes-stacked mr-2"></i>原物料庫存管理</h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportToCSV()" class="bg-amber-700 hover:bg-amber-800 text-white text-xs px-3 py-2 rounded-lg transition font-medium flex items-center gap-1 shadow-sm border border-amber-500">
                    <i class="fa-solid fa-file-csv"></i> 匯出 CSV
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto p-4 lg:p-6 mt-4">
        <div class="glass-panel rounded-2xl p-6 md:p-8">
            <div class="flex justify-between items-end mb-6 border-b border-slate-200 pb-4">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">目前庫存盤點</h2>
                    <p class="text-sm text-slate-500 mt-1">數據直接與雲端 Google 試算表同步連動。</p>
                </div>
                <span id="lastSavedTime" class="text-xs text-slate-400 font-medium">載入中...</span>
            </div>

            <div class="space-y-4" id="inventoryContainer">
                <div class="rounded-xl border border-slate-200 bg-white/60 p-6 text-center text-sm text-slate-400">正在讀取庫存品項…</div>
            </div>

            <div class="mt-8 flex justify-end gap-3 border-t border-slate-200 pt-6">
                <button onclick="loadInventoryFromCloud()" class="px-6 py-3 border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 rounded-xl transition font-bold shadow-sm">
                    <i class="fa-solid fa-rotate-left mr-1"></i> 重整讀取
                </button>
                <button onclick="saveInventoryToCloud()" id="saveBtn" class="px-8 py-3 bg-amber-600 hover:bg-amber-700 text-white rounded-xl transition font-bold shadow-md flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> 儲存雲端庫存
                </button>
            </div>
        </div>
    </main>

    <div id="toastMessage" class="fixed bottom-5 right-5 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 transform translate-y-12 opacity-0 transition-all duration-300 z-50 pointer-events-none">
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg" id="toastIcon"></i>
        <span class="text-sm font-medium" id="toastText">庫存已成功儲存！</span>
    </div>

    <script src="app.js"></script>
    <script>
        var session = TeaLove.requireSession('admin');
        var inventoryItems = [];
        var itemStyles = {
            'qty-tea': { icon: 'fa-leaf', color: 'bg-emerald-100 text-emerald-700' },
            'qty-boba': { icon: 'fa-circle', color: 'bg-amber-100 text-amber-700' },
            'qty-sugar': { icon: 'fa-bottle-droplet', color: 'bg-orange-100 text-orange-700' },
            'qty-jelly': { icon: 'fa-cubes-stacked', color: 'bg-sky-100 text-sky-700' }
        };

        if (session) loadInventoryFromCloud();

        function renderInventory(items) {
            inventoryItems = items;
            var container = document.getElementById('inventoryContainer');
            container.innerHTML = items.map(function (item) {
                var style = itemStyles[item.id] || { icon: 'fa-box', color: 'bg-slate-100 text-slate-600' };
                var low = item.status === 'low';
                return '<div class="flex flex-col gap-4 rounded-xl border p-4 transition sm:flex-row sm:items-center sm:justify-between ' + (low ? 'border-rose-200 bg-rose-50/70' : 'border-slate-200 bg-white/60 hover:bg-white') + '">' +
                    '<div class="flex items-center gap-4"><div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full ' + style.color + '"><i class="fa-solid ' + style.icon + ' text-xl"></i></div>' +
                    '<div><div class="flex flex-wrap items-center gap-2"><h3 class="text-lg font-bold text-slate-800">' + item.name + '</h3>' + (low ? '<span class="rounded-full bg-rose-100 px-2 py-0.5 text-[10px] font-bold text-rose-700">低庫存</span>' : '') + '</div>' +
                    '<p class="text-xs text-slate-500">單位：' + (item.unit || '未設定') + '・提醒門檻：' + item.threshold + '</p></div></div>' +
                    '<input type="number" id="' + item.id + '" min="0" value="' + item.quantity + '" aria-label="' + item.name + '庫存數量" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-center text-lg font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500 sm:w-28">' +
                    '</div>';
            }).join('');
        }

        async function loadInventoryFromCloud() {
            document.getElementById('lastSavedTime').textContent = '正在讀取雲端庫存…';
            try {
                var data = await TeaLove.request('getInventory');
                renderInventory(data.items || []);
                document.getElementById('lastSavedTime').textContent = data.lastSavedTime ? '最後同步：' + data.lastSavedTime.replace('T', ' ') : '尚無儲存紀錄';
            } catch (error) {
                if (error.code === 'UNAUTHORIZED') return window.location.replace('login.html?expired=1');
                document.getElementById('inventoryContainer').innerHTML = '<div class="rounded-xl border border-rose-200 bg-rose-50 p-6 text-center text-sm text-rose-600">' + TeaLove.getErrorMessage(error) + '</div>';
                document.getElementById('lastSavedTime').textContent = '讀取失敗';
            }
        }

        async function saveInventoryToCloud() {
            var saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = '正在同步至雲端…';
            var inventory = {};
            inventoryItems.forEach(function (item) {
                var input = document.getElementById(item.id);
                inventory[item.id] = input ? Number(input.value || 0) : 0;
            });

            try {
                await TeaLove.request('saveInventory', { inventory: inventory });
                showToast('庫存數據已同步至 Demo 資料庫');
                await loadInventoryFromCloud();
            } catch (error) {
                showToast(TeaLove.getErrorMessage(error), 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> 儲存雲端庫存';
            }
        }

        function showToast(message, type) {
            var toast = document.getElementById('toastMessage');
            document.getElementById('toastText').textContent = message;
            document.getElementById('toastIcon').className = type === 'error' ? 'fa-solid fa-circle-exclamation text-rose-400 text-lg' : 'fa-solid fa-circle-check text-emerald-400 text-lg';
            toast.classList.remove('opacity-0', 'translate-y-12');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(function () { toast.classList.remove('opacity-100', 'translate-y-0'); toast.classList.add('opacity-0', 'translate-y-12'); }, 2500);
        }

        function exportToCSV() {
            var csvContent = 'data:text/csv;charset=utf-8,\uFEFF原物料名稱,庫存數量,單位,低量門檻,狀態\n';
            inventoryItems.forEach(function (item) {
                var input = document.getElementById(item.id);
                csvContent += '"' + item.name + '",' + (input ? input.value || 0 : 0) + ',"' + item.unit + '",' + item.threshold + ',"' + (item.status === 'low' ? '低庫存' : '正常') + '"\n';
            });
            var link = document.createElement('a');
            link.href = encodeURI(csvContent);
            link.download = '鮮茶樂_Demo庫存盤點表.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
